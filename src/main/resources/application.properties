spring.application.name=ferreterialosmaestros

# Conexión MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ferreteria_los_maestros?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=TU_USUARIO_MYSQL
spring.datasource.password=TU_PASSWORD_MYSQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=CAMBIA_ESTA_CLAVE_POR_UNA_LARGA_Y_SECRETA_AL_MENOS_32_CARACTERES
jwt.expiration=86400000

# Swagger (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
